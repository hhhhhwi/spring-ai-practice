spring:
  application:
    name: hwiai
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    defer-datasource-initialization: true
  
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
  
  h2:
    console:
      enabled: true
      path: /h2-console
